# Pack registry for spellkit-dictionaries.
#
# This file is the ONLY thing mapping a pack name to its published artifacts. It ships
# INSIDE the gem and is versioned WITH the gem: bumping spellkit-dictionaries is how a
# consumer picks up a newly published pack version.
#
# That coupling is deliberate. spellkit's own downloader caches by SHA256(url) with no
# TTL, no ETag and no revalidation (`return cache_file if File.exist?(cache_file)` in
# lib/spellkit.rb), and this gem's fetcher deliberately matches that cache-forever
# behaviour. A stable "releases/latest/download/..." URL would therefore pin every
# consumer to whatever snapshot they happened to download first, permanently. So:
#
#   every url below MUST be an immutable, version-tagged release asset,
#
# which makes a new pack version a new url, a new cache key, and an actual refresh.
#
# `release: null` means the pack is designed and named but not yet published;
# SpellKit.enable_dictionary on it raises PackNotReleasedError rather than 404ing.

schema_version: 1

packs:
  medical:
    summary: >-
      Drug, condition, gene and target names. Domain terms only. USE general_medical
      UNLESS every token you pass is already known to be a domain term: measured on the
      v10 build, this pack rewrites 87.5% of the thousand commonest English words
      ("the" -> "dhe", "with" -> "witch"), because a dictionary with no English in it
      treats every ordinary word as an unknown to be fixed. That is inherent to a
      domain-only dictionary, not a defect in this build.
    built_from:
      - RxNorm (ingredient, brand and synonym names)
      - FDA UNII / GSRS (substance names, incl. ex-US and investigational)
      - openFDA NDC directory (US-marketed generic and brand names)
      - MONDO and MeSH (disease and condition names)
      - HGNC-backed gene and target symbols (also the protected-term source)
    notes: >-
      NLM Consumer Health Vocabulary (CHV) misspelling data is used ONLY as a held-out
      validation corpus for tuning edit_distance and frequency_threshold. It is never
      published in a pack artifact: CHV ships only inside the gated UMLS Metathesaurus
      release, so redistributing it to unlicensed third parties is not permitted.
    release: null

  general_medical:
    summary: >-
      The medical pack's terms merged onto spellkit's own general English word list, so a
      single checker instance understands both "acetaminophen" and "acetaminophen was
      administered". Use this when you do not want to manage two SpellKit::Checker
      instances yourself.
    built_from:
      - Everything in the medical pack
      - spellkit's DEFAULT_DICTIONARY_URL English 80k frequency dictionary
    notes: >-
      Frequencies from the two sources are on different scales. The merge floors medical
      terms so they stay reachable without outranking common English words; the exact
      floor is tuned against the CHV held-out corpus and pinned per release.
    release:
      tag: general-medical-v1
      released_on: "2026-09-07"
      term_count: 206496
      dictionary:
        url: https://github.com/scientist-labs/spellkit-dictionaries/releases/download/general-medical-v1/dictionary.tsv
        sha256: "8e3c8f47d154b90c823bd7bd16d85a8db625fbf042c4ecf7a847e82dffdcff4b"
      protected:
        url: https://github.com/scientist-labs/spellkit-dictionaries/releases/download/general-medical-v1/protected.txt
        sha256: "526bfb9cc1bd20f2028871aa57e150c631375cd2904122d482b7b54193c8d554"
      defaults:
        edit_distance: 2
        frequency_threshold: 1.0

# Shape of a published release, for reference when the first pack ships:
#
#   release:
#     tag: medical-v1
#     released_on: "2026-10-01"
#     term_count: 412000
#     dictionary:
#       url: https://github.com/scientist-labs/spellkit-dictionaries/releases/download/medical-v1/dictionary.tsv
#       sha256: "<64 hex chars>"
#     protected:
#       url: https://github.com/scientist-labs/spellkit-dictionaries/releases/download/medical-v1/protected.txt
#       sha256: "<64 hex chars>"
#     defaults:
#       edit_distance: 1
#       frequency_threshold: 10.0
