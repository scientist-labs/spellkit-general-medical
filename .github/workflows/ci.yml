name: build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Unpinned again as of spellkit 0.3.0, which ships a Ruby 4.0 binary in its
      # precompiled platform gem. Before that, `ruby` (latest) resolved to 4.0.x, found no
      # 4.0 ABI, fell back to the source gem, and failed to compile the Rust extension.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Run specs
        run: bundle exec rake spec

      - name: Lint
        run: bundle exec standardrb

      # The pack registers itself on require, and the specs assert the vendored data
      # matches its declared term counts, so `rspec` already covers packaging integrity.
      - name: Verify the gem packages its data
        run: |
          gem build spellkit-general-medical.gemspec
          ruby -e '
            require "rubygems/package"
            files = Gem::Package.new(Dir["spellkit-general-medical-*.gem"].first).spec.files
            %w[data/dictionary.tsv data/protected.txt].each do |needed|
              abort "gem is missing #{needed}" unless files.include?(needed)
            end
            puts "gem carries its data (#{files.length} files)"
          '
