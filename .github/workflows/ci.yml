name: build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PINNED, not "ruby" (latest). spellkit 0.2.0's precompiled platform gem carries one
      # binary per Ruby ABI under lib/spellkit/<major.minor>/, and ships 3.1 through 3.4 only.
      # On Ruby 4.0 RubyGems falls back to the SOURCE gem and tries to compile the Rust
      # extension, which fails on the runner. Raise this once spellkit publishes a 4.0 leg.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run specs
        run: bundle exec rake spec

      - name: Lint
        run: bundle exec standardrb

      # The pack artifacts cannot be built here (they need warehouse access, see
      # RELEASING.md), but the registry ships INSIDE the gem, so a malformed or
      # floating-URL entry would be shipped to every consumer. Parsing it is cheap.
      - name: Validate the pack registry
        run: |
          bundle exec ruby -e '
            require "spellkit/dictionaries"
            SpellKit::Dictionaries.packs.each do |name, pack|
              state = pack.released? ? pack.release.tag : "unreleased"
              puts format("%-18s %s", name, state)
            end
          '
