name: Yank spellkit-dictionaries

# ONE-OFF, and deliberately hard-coded to a single gem name.
#
# spellkit-dictionaries was superseded within a day: its registry moved into spellkit
# 1.0.0 and its data into spellkit-general-medical. Yanking is done here rather than from
# a laptop because the RubyGems credential lives in CI, not on anyone's machine - the same
# authority that published these versions retires them.
#
# The gem name is not an input on purpose: an arbitrary-yank button in a public repo is a
# sharp tool, and this workflow is deleted immediately after it runs.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yank" to proceed'
        required: true
        type: string

jobs:
  yank:
    if: ${{ inputs.confirm == 'yank' }}
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Yank every published version
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          set -euo pipefail
          for v in 1.1.0 1.0.0; do
            echo "yanking spellkit-dictionaries $v"
            gem yank spellkit-dictionaries -v "$v"
          done

      - name: Verify nothing resolvable remains
        run: |
          set -euo pipefail
          sleep 15
          remaining=$(gem list -r spellkit-dictionaries --all | grep -c "spellkit-dictionaries" || true)
          echo "resolvable versions remaining: $remaining"
          if gem list -r spellkit-dictionaries --all | grep -qE "\(.*[0-9]"; then
            echo "still resolvable:"; gem list -r spellkit-dictionaries --all
            exit 1
          fi
          echo "spellkit-dictionaries is fully yanked"
